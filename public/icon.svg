<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark UI Background (Match bg-primary) -->
    <rect id="bg_rect" width="1024" height="1024" rx="192" fill="#0A0A0F" />
    
    <!-- Premium Accent Gradient (Match accent-gradient) -->
    <linearGradient id="accent_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>
    
    <!-- Glass Effect -->
    <linearGradient id="glass_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12" />
      <stop offset="100%" stop-color="white" stop-opacity="0.04" />
    </linearGradient>

    <!-- Subtle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="0" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="25" />
      <feOffset dx="0" dy="20" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Container with Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Rounded Body (Glassmorphism Style) -->
    <rect x="128" y="128" width="768" height="768" rx="192" fill="#0A0A0F" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
    <rect x="128" y="128" width="768" height="768" rx="192" fill="url(#glass_grad)" />

    <!-- Selection Corners (The Snap aspect - White Accent) -->
    <g filter="url(#glow)">
      <path d="M320 384V320H384" stroke="white" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M640 320H704V384" stroke="white" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M704 640V704H640" stroke="white" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M384 704H320V640" stroke="white" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Central Camera Lens (The Open aspect - Gradient Accent) -->
    <circle cx="512" cy="512" r="160" stroke="url(#accent_grad)" stroke-width="32" />
    <circle cx="512" cy="512" r="70" fill="white" />
    
    <!-- Reflective Detail -->
    <circle cx="480" cy="480" r="30" fill="white" fill-opacity="0.2" />
    
    <!-- Status Dot (Top Right) -->
    <circle cx="680" cy="344" r="20" fill="white" fill-opacity="0.4" />
  </g>
</svg>
